name: Build
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build
        run: ./build.sh
      - name: Package
        run: |
          mkdir out
          cp build/d3d9watch.asi out/
          cd out && sha256sum *.asi > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: asi-${{ github.sha }}
          path: out/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
